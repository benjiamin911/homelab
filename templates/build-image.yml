# Copy this file into YOUR project repo as .github/workflows/build-image.yml
# It builds the Dockerfile at repo root and pushes ghcr.io/<owner>/<repo>:latest (+ :sha).
# Then in homelab/services/<name>/compose.yml use:  image: ghcr.io/<owner>/<repo>:latest
# Public repo -> public package by default -> homelab can pull with no login.
name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
