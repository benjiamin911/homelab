# Syncthing：Mac ↔ jarvis 双向同步两个 Obsidian vault（各一个共享文件夹）。
# 首次 up 之后在 jarvis 上跑一次 services/syncthing/configure.sh（幂等）完成文件夹 / 选项 / GUI 密码配置。
# .env 需要：OBSIDIAN_ROOT（宿主机放 vault 的目录）、SYNCTHING_GUI_USER、SYNCTHING_GUI_PASSWORD。
services:
  syncthing:
    image: syncthing/syncthing:2
    container_name: syncthing
    hostname: jarvis                                  # 即 Syncthing 里显示的设备名
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:8384:8384"                      # Web GUI / REST API，只在 tailnet 可达
      - "${BIND_ADDR}:22000:22000/tcp"                # 同步协议 TCP
      - "${BIND_ADDR}:22000:22000/udp"                # 同步协议 QUIC
    volumes:
      - "${DATA_ROOT}/syncthing:/var/syncthing"                                           # 配置 + 索引数据库
      - "${OBSIDIAN_ROOT:?OBSIDIAN_ROOT 未在 .env 设置}/Obsidian Vault:/vaults/Obsidian Vault"  # jarvis 的知识库 vault
      - "${OBSIDIAN_ROOT:?OBSIDIAN_ROOT 未在 .env 设置}/Project:/vaults/Project"                # Mac 的项目 vault
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
