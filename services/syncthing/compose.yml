# Syncthing：jarvis 与个人设备之间双向同步两个 Obsidian vault（各一个共享文件夹），只走 tailnet。
# 首次 up 之后在 jarvis 上跑一次 services/syncthing/configure.sh（幂等）完成文件夹 / 选项 / GUI 密码配置。
# .env 需要：OBSIDIAN_ROOT（宿主机放 vault 的目录）、SYNCTHING_GUI_USER、SYNCTHING_GUI_PASSWORD。
services:
  syncthing:
    image: syncthing/syncthing:2
    container_name: syncthing
    hostname: jarvis                                  # 即 Syncthing 里显示的设备名
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:?BIND_ADDR 未在 .env 设置}:8384:8384"                      # Web GUI / REST API，只在 tailnet 可达
      - "${BIND_ADDR:?BIND_ADDR 未在 .env 设置}:22000:22000/tcp"                # 同步协议 TCP
      - "${BIND_ADDR:?BIND_ADDR 未在 .env 设置}:22000:22000/udp"                # 同步协议 QUIC
    volumes:
      - "${DATA_ROOT}/syncthing:/var/syncthing"                                           # 配置 + 索引数据库
      # 两个 vault 用长语法并关闭自动建目录：路径不存在时 up 直接报错，而不是让 dockerd 以 root 建一个空目录
      - type: bind                                    # jarvis 的知识库 vault
        source: "${OBSIDIAN_ROOT:?OBSIDIAN_ROOT 未在 .env 设置}/Obsidian Vault"
        target: "/vaults/Obsidian Vault"
        bind: { create_host_path: false }
      - type: bind                                    # Mac 的项目 vault
        source: "${OBSIDIAN_ROOT:?OBSIDIAN_ROOT 未在 .env 设置}/Project"
        target: /vaults/Project
        bind: { create_host_path: false }
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
