# 复制这个目录为 services/<你的服务名>/ 并改下面内容。
# 要按名字访问（http://<名字>.home.arpa）：在 services/caddy/Caddyfile 加一段，并在 services/caddy/site/index.html 的列表里加一行。
services:
  app:
    image: example/app:latest
    container_name: CHANGE_ME
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:?BIND_ADDR 未在 .env 设置}:8000:8000"          # host:container，host 侧绑 Tailscale IP
    volumes:
      - "${DATA_ROOT}/CHANGE_ME:/data"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
